# Reconcile production with main without writing deployment state back to Git.
steps:
  - id: determine-action
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        deployed_sha="$$(gcloud run services describe "${_SERVICE}" \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --flatten="spec.template.spec.containers[0].env[]" \
          --format="csv[no-heading](spec.template.spec.containers[0].env.name,spec.template.spec.containers[0].env.value)" \
          | awk -F, '$$1 == "APP_GIT_SHA" { print $$2 }')"
        test -n "$${deployed_sha}" || {
          echo "Production does not expose APP_GIT_SHA." >&2
          exit 1
        }
        python3 scripts/reconcile_deployment.py \
          --repository "${_GITHUB_REPOSITORY}" \
          --deployed-sha "$${deployed_sha}" \
          --target-sha "$COMMIT_SHA" \
          > /workspace/deployment-action
        printf 'Deployment reconciliation action: %s\n' \
          "$$(cat /workspace/deployment-action)"
        # Save deployed SHA for the diff step
        printf '%s' "$${deployed_sha}" > /workspace/deployed-sha

  - id: fetch-diff
    name: python:3.12-slim
    entrypoint: python
    env:
      - GITHUB_REPOSITORY=${_GITHUB_REPOSITORY}
      - TARGET_SHA=$COMMIT_SHA
    args:
      - -c
      - |
        import json
        import os
        import urllib.request

        with open("/workspace/deployment-action", encoding="utf-8") as handle:
            if handle.read().strip() != "deploy":
                raise SystemExit(0)

        with open("/workspace/deployed-sha", encoding="utf-8") as handle:
            deployed_sha = handle.read().strip()
        if not deployed_sha:
            print("No deployed SHA found, skipping diff.")
            raise SystemExit(0)

        repo = os.environ["GITHUB_REPOSITORY"]
        target = os.environ["TARGET_SHA"]
        url = f"https://api.github.com/repos/{repo}/compare/{deployed_sha}...{target}"
        req = urllib.request.Request(
            url,
            headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": "china-a-share-deploy-notifier",
            },
        )
        with urllib.request.urlopen(req, timeout=30) as resp:
            data = json.load(resp)

        commits = data.get("commits", [])
        files = data.get("files", [])
        compare_url = data.get("html_url", "")

        # Save commit messages (first line only, max 10)
        commit_lines = []
        for c in commits[:10]:
            msg = c["commit"]["message"].split("\n")[0][:80]
            author = c["commit"]["author"]["name"]
            commit_lines.append(f"  • {msg} ({author})")
        if len(commits) > 10:
            commit_lines.append(f"  ... and {len(commits) - 10} more commits")

        # Save changed files (max 15)
        file_lines = []
        for f in files[:15]:
            file_lines.append(f"  {'+' if f['status'] == 'added' else '~' if f['status'] == 'modified' else '-'} {f['filename']}")
        if len(files) > 15:
            file_lines.append(f"  ... and {len(files) - 15} more files")

        with open("/workspace/diff-commits", "w") as h:
            h.write("\n".join(commit_lines))
        with open("/workspace/diff-files", "w") as h:
            h.write("\n".join(file_lines))
        with open("/workspace/diff-url", "w") as h:
            h.write(compare_url)
        with open("/workspace/diff-count", "w") as h:
            h.write(f"{len(commits)} commits · {len(files)} files")
        print(f"Diff: {len(commits)} commits, {len(files)} files changed.")

  - id: notify-start
    name: python:3.12-slim
    entrypoint: python
    secretEnv:
      - FEISHU_WEBHOOK
    env:
      - SERVICE_NAME=${_SERVICE}
      - SERVICE_REGION=${_REGION}
      - SOURCE_COMMIT_SHA=${COMMIT_SHA}
    args:
      - -c
      - |
        import json
        import os
        import urllib.request

        with open("/workspace/deployment-action", encoding="utf-8") as handle:
            if handle.read().strip() != "deploy":
                raise SystemExit(0)

        diff_count = ""
        diff_commits = ""
        diff_files = ""
        diff_url = ""
        try:
            with open("/workspace/diff-count", encoding="utf-8") as h:
                diff_count = h.read().strip()
            with open("/workspace/diff-commits", encoding="utf-8") as h:
                diff_commits = h.read().strip()
            with open("/workspace/diff-files", encoding="utf-8") as h:
                diff_files = h.read().strip()
            with open("/workspace/diff-url", encoding="utf-8") as h:
                diff_url = h.read().strip()
        except FileNotFoundError:
            pass

        sha = os.environ["SOURCE_COMMIT_SHA"][:12]
        parts = [
            "🚀 A-Share Laboratory 部署开始",
            f"Service: {os.environ['SERVICE_NAME']} · {os.environ['SERVICE_REGION']}",
            f"Commit: {sha}",
        ]
        if diff_count:
            parts.append(f"变更: {diff_count}")
        if diff_commits:
            parts.append(f"Commits:\n{diff_commits}")
        if diff_files:
            parts.append(f"Files:\n{diff_files}")
        if diff_url:
            parts.append(f"详情: {diff_url}")

        message = "\n".join(parts)
        request = urllib.request.Request(
            os.environ["FEISHU_WEBHOOK"],
            data=json.dumps(
                {
                    "msg_type": "text",
                    "content": {"text": message},
                }
            ).encode(),
            headers={"Content-Type": "application/json"},
        )
        with urllib.request.urlopen(request, timeout=15) as response:
            payload = json.load(response)
        if payload.get("code", payload.get("StatusCode", 0)) != 0:
            raise RuntimeError(f"Start notification was rejected: {payload}")
        print("Feishu start notification sent.")

  - id: frontend-check
    name: node:22-alpine
    entrypoint: sh
    args:
      - -ceu
      - |
        test "$$(cat /workspace/deployment-action)" = deploy || exit 0
        corepack enable
        cd frontend
        pnpm install --frozen-lockfile
        pnpm run build

  - id: backend-check
    name: python:3.12-slim
    entrypoint: sh
    args:
      - -ceu
      - |
        test "$$(cat /workspace/deployment-action)" = deploy || exit 0
        python -m pip install --disable-pip-version-check ".[dev]"
        python -m pytest

  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        test "$$(cat /workspace/deployment-action)" = deploy || exit 0
        docker build \
          --tag "${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA" \
          .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        test "$$(cat /workspace/deployment-action)" = deploy || exit 0
        docker push "${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA"

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test "$$(cat /workspace/deployment-action)" = deploy || exit 0
        gcloud run deploy "${_SERVICE}" \
          --image "${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA" \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --allow-unauthenticated \
          --cpu 1 \
          --memory 1Gi \
          --min 0 \
          --max 1 \
          --concurrency 4 \
          --timeout 300 \
          --service-account "${_RUNTIME_SERVICE_ACCOUNT}" \
          --set-env-vars "TUSHARE_CACHE_BUCKET=${_CACHE_BUCKET},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_RUN_REGION=${_REGION},ANALYSIS_JOB_NAME=${_ANALYSIS_JOB},APP_GIT_BRANCH=main,APP_GIT_SHA=$COMMIT_SHA,ADMIN_EMAIL=${_ADMIN_EMAIL},GOOGLE_OAUTH_CLIENT_ID=${_GOOGLE_OAUTH_CLIENT_ID},GITHUB_FIX_REPO=${_GITHUB_REPOSITORY}" \
          --set-secrets "TUSHARE_TOKEN=tushare-token:latest,DEEPSEEK_API_KEY=deepseek-api-key:latest,ZAI_API_KEY=zai-api-key:latest,GITHUB_FIX_TOKEN=github-fix-token:latest" \
          --quiet

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test "$$(cat /workspace/deployment-action)" = deploy || exit 0
        gcloud run jobs deploy "${_ANALYSIS_JOB}" \
          --image "${_IMAGE_REPOSITORY}/${_SERVICE}:$COMMIT_SHA" \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --command python \
          --args=-m,china_a_share.worker \
          --tasks 1 \
          --parallelism 1 \
          --max-retries 1 \
          --task-timeout 2h \
          --cpu 1 \
          --memory 4Gi \
          --service-account "${_RUNTIME_SERVICE_ACCOUNT}" \
          --set-env-vars "TUSHARE_CACHE_BUCKET=${_CACHE_BUCKET},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_RUN_REGION=${_REGION},ANALYSIS_JOB_NAME=${_ANALYSIS_JOB},APP_GIT_BRANCH=main,APP_GIT_SHA=$COMMIT_SHA" \
          --set-secrets "TUSHARE_TOKEN=tushare-token:latest,DEEPSEEK_API_KEY=deepseek-api-key:latest,ZAI_API_KEY=zai-api-key:latest" \
          --quiet

  - id: verify-deployment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test "$$(cat /workspace/deployment-action)" = deploy || exit 0
        ready_revision="$$(gcloud run services describe "${_SERVICE}" \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --format="value(status.latestReadyRevisionName)")"
        deployed_sha="$$(gcloud run services describe "${_SERVICE}" \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --flatten="spec.template.spec.containers[0].env[]" \
          --format="csv[no-heading](spec.template.spec.containers[0].env.name,spec.template.spec.containers[0].env.value)" \
          | awk -F, '$$1 == "APP_GIT_SHA" { print $$2 }')"
        traffic="$$(gcloud run services describe "${_SERVICE}" \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --format="value(status.traffic.percent)")"
        test "$${deployed_sha}" = "$COMMIT_SHA" || {
          echo "Production SHA $${deployed_sha} does not match $COMMIT_SHA." >&2
          exit 1
        }
        test "$${traffic}" = 100 || {
          echo "Latest revision traffic is $${traffic}%, expected 100%." >&2
          exit 1
        }
        curl --fail --silent --show-error "${_SERVICE_URL}/api/health"
        printf '\nVerified revision %s at commit %s.\n' \
          "$${ready_revision}" "$${deployed_sha}"

  - id: notify-feishu
    name: python:3.12-slim
    entrypoint: python
    secretEnv:
      - FEISHU_WEBHOOK
    env:
      - SERVICE_NAME=${_SERVICE}
      - SERVICE_REGION=${_REGION}
      - SERVICE_URL=${_SERVICE_URL}
      - DEPLOYED_COMMIT=$COMMIT_SHA
    args:
      - -c
      - |
        import json
        import os
        import urllib.request

        with open("/workspace/deployment-action", encoding="utf-8") as handle:
            if handle.read().strip() != "deploy":
                raise SystemExit(0)

        diff_count = ""
        diff_commits = ""
        diff_files = ""
        diff_url = ""
        try:
            with open("/workspace/diff-count", encoding="utf-8") as h:
                diff_count = h.read().strip()
            with open("/workspace/diff-commits", encoding="utf-8") as h:
                diff_commits = h.read().strip()
            with open("/workspace/diff-files", encoding="utf-8") as h:
                diff_files = h.read().strip()
            with open("/workspace/diff-url", encoding="utf-8") as h:
                diff_url = h.read().strip()
        except FileNotFoundError:
            pass

        sha = os.environ["DEPLOYED_COMMIT"][:12]
        parts = [
            "✅ A-Share Laboratory 部署成功",
            f"Service: {os.environ['SERVICE_NAME']} · {os.environ['SERVICE_REGION']}",
            f"Commit: {sha}",
            f"URL: {os.environ['SERVICE_URL']}",
        ]
        if diff_count:
            parts.append(f"变更: {diff_count}")
        if diff_commits:
            parts.append(f"Commits:\n{diff_commits}")
        if diff_files:
            parts.append(f"Files:\n{diff_files}")
        if diff_url:
            parts.append(f"详情: {diff_url}")

        message = "\n".join(parts)
        request = urllib.request.Request(
            os.environ["FEISHU_WEBHOOK"],
            data=json.dumps(
                {
                    "msg_type": "text",
                    "content": {"text": message},
                }
            ).encode(),
            headers={"Content-Type": "application/json"},
        )
        with urllib.request.urlopen(request, timeout=15) as response:
            payload = json.load(response)
        if payload.get("code", payload.get("StatusCode", 0)) != 0:
            raise RuntimeError(f"Feishu notification was rejected: {payload}")
        print("Feishu deployment notification sent.")

substitutions:
  _REGION: asia-east2
  _SERVICE: china-a-share-lab
  _ANALYSIS_JOB: china-a-share-analysis-worker
  _RUNTIME_SERVICE_ACCOUNT: china-a-share-runner@china-a-share-lab.iam.gserviceaccount.com
  _IMAGE_REPOSITORY: asia-east2-docker.pkg.dev/china-a-share-lab/cloud-run-source-deploy
  _CACHE_BUCKET: china-a-share-lab-cache-asia-east2
  _SERVICE_URL: https://china-a-share-lab-1079739428171.asia-east2.run.app
  _GITHUB_REPOSITORY: howardliuchenxi/china_a_share
  _ADMIN_EMAIL: howardliuchenxi1@gmail.com
  _GOOGLE_OAUTH_CLIENT_ID: 1079739428171-f572obvnhd989gh04onlpp5fmai9cf5q.apps.googleusercontent.com

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/feishu-bot-webhook/versions/latest
      env: FEISHU_WEBHOOK

timeout: 1800s
