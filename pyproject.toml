[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "china-a-share"
version = "0.1.0"
description = "Provider-neutral A-share market-data laboratory"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    # Keep the local Python 3.9 environment on the pre-cryptography google-auth line.
    "google-api-core>=2.15,<2.25",
    "google-auth>=2.26,<2.40",
    "google-cloud-storage>=2.18,<3.0",
    "pandas>=2.0,<3.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "tushare>=1.4,<2.0",
    # The macOS system Python links LibreSSL and requires urllib3 1.x.
    "urllib3>=1.26,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
]

[project.scripts]
a-share = "china_a_share.cli:main"
a-share-web = "china_a_share.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls real external APIs and is skipped unless explicitly enabled",
]
